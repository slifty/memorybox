version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '00:00'
      timezone: 'Etc/UTC'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build'
      include: 'scope'
    ignore:
      # @types/node tracks the Node version in .node-version, not the latest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint pins its typescript peer to <6.1.0, so the ceiling is
      # 6.1, not 7. Minors have to be held back alongside majors.
      - dependency-name: 'typescript'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '00:00'
      timezone: 'Etc/UTC'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
