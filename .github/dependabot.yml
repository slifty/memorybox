version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '00:00'
      timezone: 'Etc/UTC'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build'
      include: 'scope'
    ignore:
      # @types/node tracks the Node version in .node-version, not the latest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint pins its typescript peer to <6.1.0, so the ceiling is
      # 6.1, not 7. Minors have to be held back alongside majors.
      - dependency-name: 'typescript'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      # The Expo SDK decides these versions. They move together, with
      # `npx expo install --fix`, when the SDK is upgraded.
      - dependency-name: 'react'
      - dependency-name: 'react-native'
      - dependency-name: '@react-native/*'
      - dependency-name: '@types/react'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-status-bar'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-expo'
        update-types: ['version-update:semver-major']
      # jest-expo is built on Jest 29.
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@jest/globals'
        update-types: ['version-update:semver-major']
      # Each test-renderer minor moves to a react-reconciler that needs a newer
      # React, so it follows the React version the SDK sets.
      - dependency-name: 'test-renderer'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '00:00'
      timezone: 'Etc/UTC'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
